# Configuration for the Snakemake pipelines in src/02_graph_statistics/snakemake/.
# These pipelines are experimental: validated with `snakemake -n` only and not used
# to generate the manuscript results. The plain shell/Python scripts read
# config/pipeline.config instead.

ref: ARS_UCD2
pangenome_prefix: IND_pangenome_final
threads: 100
bin_size: 1000000

# Set this to a BED file of path ranges to enable the `pav` rule
# (odgi pav requires -b/--bed-file; left unset because no such file
# exists yet in this repo - see the Phase 2 bugfix notes).
# pav_bed_file: path/to/ranges.bed

# The 29 ARS-UCD2.0 autosomes, in chromosome order (chr01-chr29).
# Same static list used in vg_deconstruct/snmk_out/*.sh.
